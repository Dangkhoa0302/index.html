<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop - Reiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDFA; --ink:#171B3D; --muted:#4A507D; --moon:#F2C94C; --line:#C5CCEB; --card:#F4F6FD;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12152E;--ink:#E9EDFA;--muted:#A3A9D6;--line:#2B3160;--card:#1A1E3F}
}
:root[data-theme="dark"]{--bg:#12152E;--ink:#E9EDFA;--muted:#A3A9D6;--line:#2B3160;--card:#1A1E3F}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:1.0625rem;line-height:1.65}
main{max-width:46rem;margin:0 auto;padding:0 1.5rem 4rem}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:46rem;margin:0 auto;padding:.7rem 1.5rem;display:flex;align-items:center;gap:.6rem}
.logo{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.3rem;margin-right:auto;text-decoration:none}
.btn{font:inherit;font-size:.95rem;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:.4rem 1rem;border-radius:999px;text-decoration:none;display:inline-block;line-height:1.5}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn:hover{background:var(--moon);border-color:var(--moon);color:#171B3D}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--moon);outline-offset:3px}
.count{display:inline-block;min-width:1.4em;padding:0 .3em;margin-left:.3em;border-radius:999px;background:var(--moon);color:#171B3D;font-size:.8rem;text-align:center}
.hero{position:relative;padding:4rem 0 3rem;overflow:hidden}
.moon{position:absolute;right:-2rem;top:1.5rem;width:min(52vw,16rem);aspect-ratio:1;border-radius:50%;background:var(--moon);animation:rise 1.2s ease-out both}
.hero p.hi{position:relative;margin:0 0 .25rem;color:var(--muted)}
h1{position:relative;margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(4.5rem,24vw,10rem);line-height:.95;letter-spacing:-.04em}
.tag{position:relative;margin:1.25rem 0 0;max-width:26rem;font-size:1.2rem}
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:500;font-size:1.5rem;margin:0 0 .75rem}
section{padding:2.25rem 0;border-top:1px solid var(--line)}
section p{margin:0;max-width:34rem}
ul.chips{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:.6rem}
ul.chips li{padding:.35rem .9rem;border:1px solid var(--line);border-radius:999px}
a{color:var(--ink);text-decoration-color:var(--moon);text-decoration-thickness:.18em;text-underline-offset:.2em}
a.btn{text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:4/3;background:var(--moon);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:3rem;color:#171B3D}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .b{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.25rem;flex:1}
.card h3{margin:0;font-size:1.05rem;font-weight:500}
.card .d{font-size:.9rem;color:var(--muted);flex:1}
.price{font-weight:500}
.card .btn{margin-top:.5rem;align-self:flex-start}
footer{color:var(--muted);font-size:.9rem;padding-top:1rem}
/* Giỏ hàng */
#ov{position:fixed;inset:0;background:rgba(10,12,30,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
aside{position:fixed;top:0;right:0;bottom:0;width:min(24rem,100%);background:var(--bg);border-left:1px solid var(--line);z-index:10;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;padding:calc(1rem + env(safe-area-inset-top,0px)) 1.25rem calc(1rem + env(safe-area-inset-bottom,0px))}
body.open #ov{opacity:1;pointer-events:auto}
body.open aside{transform:none}
aside header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
aside h2{margin:0}
#items{flex:1;overflow-y:auto}
.row{display:flex;gap:.75rem;padding:.8rem 0;border-bottom:1px solid var(--line);align-items:center}
.row .n{flex:1;line-height:1.35}
.row small{color:var(--muted)}
.q{display:flex;align-items:center;gap:.4rem}
.q button{width:2rem;height:2rem;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:1rem;cursor:pointer}
.q button:hover{background:var(--moon);border-color:var(--moon);color:#171B3D}
.total{display:flex;justify-content:space-between;font-weight:500;font-size:1.15rem;padding:1rem 0 .75rem}
.empty{color:var(--muted);padding:1rem 0}
aside .btn.fill{text-align:center;width:100%}
.note{font-size:.8rem;color:var(--muted);margin:.6rem 0 0}
@keyframes rise{from{transform:translateY(2rem);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.moon{animation:none}html{scroll-behavior:auto}aside,#ov{transition:none}}
@media(max-width:400px){.btn{padding:.35rem .75rem;font-size:.9rem}nav .in{padding-left:1rem;padding-right:1rem}}
</style>
</head>
<body>
<nav>
  <div class="in">
    <a class="logo" href="index.html">Reiya</a>
    <a class="btn" href="index.html">Trang cá nhân</a>
    <button class="btn fill" id="openCart" aria-label="Mở giỏ hàng">Giỏ hàng <span class="count" id="cnt">0</span></button>
  </div>
</nav>

<main>
  <section id="shop" style="border-top:0;padding-top:2.5rem">
    <h2>Sản phẩm</h2>
    <div class="grid" id="grid"></div>
  </section>
  <footer>© 2026 Reiya</footer>
</main>

<div id="ov"></div>
<aside aria-label="Giỏ hàng" aria-hidden="true">
  <header><h2>Giỏ hàng</h2><button class="btn" id="closeCart">Đóng</button></header>
  <div id="items"></div>
  <div class="total"><span>Tổng</span><span id="sum">0đ</span></div>
  <a class="btn fill" id="order" href="#">Đặt hàng qua email</a>
  <p class="note">Bấm đặt hàng sẽ mở email có sẵn danh sách sản phẩm gửi cho Reiya.</p>
</aside>

];
const EMAIL = "dangkhoa326vn@gmail.com";
/* =================================== */

const fmt = n => new Intl.NumberFormat("vi-VN").format(n) + "đ";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
let cart = {};
try { cart = JSON.parse(localStorage.getItem("reiya-cart") || "{}") || {}; } catch (e) { cart = {}; }
const save = () => { try { localStorage.setItem("reiya-cart", JSON.stringify(cart)); } catch (e) {} };

$("grid").innerHTML = PRODUCTS.map(p => `
  <article class="card">
    <div class="thumb">${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy">` : esc(p.name.trim().charAt(0).toUpperCase())}</div>
    <div class="b">
      <h3>${esc(p.name)}</h3>
      <div class="d">${esc(p.desc)}</div>
      <div class="price">${fmt(p.price)}</div>
      <button class="btn" data-add="${p.id}">Thêm vào giỏ</button>
    </div>
  </article>`).join("");

function render() {
  const rows = PRODUCTS.filter(p => cart[p.id] > 0);
  const qty = rows.reduce((a, p) => a + cart[p.id], 0);
  const total = rows.reduce((a, p) => a + cart[p.id] * p.price, 0);
  $("cnt").textContent = qty;
  $("sum").textContent = fmt(total);
  $("items").innerHTML = rows.length ? rows.map(p => `
    <div class="row">
      <div class="n">${esc(p.name)}<br><small>${fmt(p.price)}</small></div>
      <div class="q"><button data-dec="${p.id}" aria-label="Giảm">−</button><span>${cart[p.id]}</span><button data-inc="${p.id}" aria-label="Tăng">+</button></div>
    </div>`).join("") : '<p class="empty">Giỏ đang trống.</p>';
  const lines = rows.map(p => `- ${p.name} x${cart[p.id]}: ${fmt(p.price * cart[p.id])}`).join("\n");
  const body = `Xin chào Reiya,\n\nMình muốn đặt:\n${lines}\n\nTổng: ${fmt(total)}\n\nTên / SĐT / Địa chỉ nhận hàng:\n`;
  const o = $("order");
  o.href = rows.length ? `mailto:${EMAIL}?subject=${encodeURIComponent("Đơn hàng từ trang của Reiya")}&body=${encodeURIComponent(body)}` : "#";
  o.style.opacity = rows.length ? 1 : .45;
  o.style.pointerEvents = rows.length ? "auto" : "none";
  save();
}
function toggle(open) {
  document.body.classList.toggle("open", open);
  document.querySelector("aside").setAttribute("aria-hidden", open ? "false" : "true");
}
document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if (d.add) { cart[d.add] = (cart[d.add] || 0) + 1; render(); toggle(true); }
  if (d.inc) { cart[d.inc]++; render(); }
  if (d.dec) { cart[d.dec]--; if (cart[d.dec] <= 0) delete cart[d.dec]; render(); }
});
$("openCart").onclick = () => toggle(true);
$("closeCart").onclick = $("ov").onclick = () => toggle(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") toggle(false); });
render();

</script>
</body>
